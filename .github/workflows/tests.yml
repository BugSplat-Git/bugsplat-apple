name: Tests
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-macos:
    name: macOS Tests
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Build PLCrashReporter
      run: |
        cd Vendor/PLCrashReporter
        
        # Build macOS framework 
        xcodebuild -scheme "CrashReporter macOS Framework" -configuration Release \
          BUILD_LIBRARY_FOR_DISTRIBUTION=YES SKIP_INSTALL=NO MACH_O_TYPE=staticlib -quiet
        
        # Get derived data path and create xcframework
        DERIVED_DATA=$(xcodebuild -scheme "CrashReporter macOS Framework" -configuration Release -showBuildSettings 2>/dev/null | grep -m 1 "BUILD_DIR" | awk '{print $3}' | sed 's|/Build/Products||')
        PRODUCTS_DIR="$DERIVED_DATA/Build/Products"
        
        xcodebuild -create-xcframework \
          -framework "$PRODUCTS_DIR/Release-macosx/CrashReporter.framework" \
          -output "CrashReporter.xcframework"
        
    - name: Run macOS Tests
      run: |
        set -o pipefail
        xcodebuild test \
          -workspace BugSplat.xcworkspace \
          -scheme BugSplatMacTests \
          -destination 'platform=macOS' \
          CODE_SIGNING_ALLOWED=NO

  test-ios:
    name: iOS Tests
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Show Xcode version
      run: xcodebuild -version

    - name: List available simulators
      run: xcrun simctl list devices available

    - name: Build PLCrashReporter
      run: |
        cd Vendor/PLCrashReporter
        
        # Build iOS device and simulator frameworks
        xcodebuild -scheme "CrashReporter iOS Framework" -configuration Release -sdk iphoneos \
          BUILD_LIBRARY_FOR_DISTRIBUTION=YES SKIP_INSTALL=NO MACH_O_TYPE=staticlib -quiet
        xcodebuild -scheme "CrashReporter iOS Framework" -configuration Release -sdk iphonesimulator \
          BUILD_LIBRARY_FOR_DISTRIBUTION=YES SKIP_INSTALL=NO MACH_O_TYPE=staticlib -quiet
        
        # Get derived data path and create xcframework
        DERIVED_DATA=$(xcodebuild -scheme "CrashReporter iOS Framework" -configuration Release -sdk iphoneos -showBuildSettings 2>/dev/null | grep -m 1 "BUILD_DIR" | awk '{print $3}' | sed 's|/Build/Products||')
        PRODUCTS_DIR="$DERIVED_DATA/Build/Products"
        
        xcodebuild -create-xcframework \
          -framework "$PRODUCTS_DIR/Release-iphoneos/CrashReporter.framework" \
          -framework "$PRODUCTS_DIR/Release-iphonesimulator/CrashReporter.framework" \
          -output "CrashReporter.xcframework"

    - name: Run iOS Tests
      run: |
        set -o pipefail
        # Pick an iPhone simulator from the newest installed iOS runtime by UDID.
        # A hardcoded device name breaks whenever the runner image's device set
        # changes, and omitting OS resolves to the newest runtime, which older
        # device models are not paired with.
        UDID=$(xcrun simctl list devices available --json | python3 -c '
        import json, sys
        data = json.load(sys.stdin)["devices"]
        def ver(k):
            return tuple(int(p) for p in k.split("iOS-")[-1].split("-") if p.isdigit())
        ios = {k: v for k, v in data.items() if ".iOS-" in k}
        for k in sorted(ios, key=ver, reverse=True):
            for d in ios[k]:
                if d.get("isAvailable") and d["name"].startswith("iPhone"):
                    print(d["udid"]); sys.exit()
        sys.exit("no available iPhone simulator found")
        ')
        xcrun simctl list devices | grep "$UDID"
        xcodebuild test \
          -workspace BugSplat.xcworkspace \
          -scheme BugSplatIOSTests \
          -destination "platform=iOS Simulator,id=$UDID" \
          CODE_SIGNING_ALLOWED=NO
