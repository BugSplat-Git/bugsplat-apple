name: release

# Builds BugSplatNative.xcframework from bugsplat-native at a ref, publishes it as a GitHub release
# asset, and rewrites Package.swift so consumers get the binary target by URL + checksum.
# Versions come from bugsplat-native's VERSION file (9.x.y; every repo tags the same version).
on:
  workflow_dispatch:
    inputs:
      native_ref:
        description: bugsplat-native ref to build (branch, tag or commit)
        default: main
      version:
        description: Release version (default: bugsplat-native's VERSION file)
        required: false

permissions:
  contents: write

env:
  NATIVE_REPO: BugSplat-Git/bugsplat-native
  CRASHPAD_COMMIT: db44314646cbd0825a73b58dd2b7b5f4faca64a7

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Checkout bugsplat-native
        uses: actions/checkout@v4
        with:
          repository: ${{ env.NATIVE_REPO }}
          ref: ${{ inputs.native_ref }}
          path: native
          token: ${{ secrets.GH_PAT }}

      - name: Resolve version
        id: version
        run: |
          v="${{ inputs.version }}"
          [ -n "$v" ] || v="$(tr -d '[:space:]' < native/VERSION)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Releasing $v"

      - name: Install the Apple certificate
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Cache Crashpad build
        id: crashpad-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/crashpad-work
          key: crashpad-${{ env.CRASHPAD_COMMIT }}-macos-15-v1

      - name: Fetch depot_tools and build Crashpad
        if: steps.crashpad-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$GITHUB_WORKSPACE/depot_tools"
          export PATH="$GITHUB_WORKSPACE/depot_tools:$PATH"
          gclient --version
          mkdir -p crashpad-work && cd crashpad-work
          fetch --no-history crashpad
          cd crashpad
          git fetch --depth 1 origin "$CRASHPAD_COMMIT" && git checkout "$CRASHPAD_COMMIT"
          gclient sync
          gn gen out/mac-release --args='is_debug=false target_cpu="arm64"'
          ninja -C out/mac-release client handler:crashpad_handler snapshot minidump util

      - name: Build BugSplatNative.xcframework
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: |
          args=(--native native --crashpad-root "$GITHUB_WORKSPACE/crashpad-work/crashpad")
          if [ -n "$SIGNING_IDENTITY" ]; then args+=(--sign "$SIGNING_IDENTITY"); fi
          scripts/build-native.sh "${args[@]}"
          cd Frameworks && zip -qry BugSplatNative.xcframework.zip BugSplatNative.xcframework

      - name: Tests
        run: |
          set -o pipefail
          swift test --skip RuntimeTests 2>&1 | tail -40

      - name: Point Package.swift and the podspec at the release asset
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHECKSUM=$(swift package compute-checksum Frameworks/BugSplatNative.xcframework.zip)
          URL="https://github.com/BugSplat-Git/bugsplat-apple/releases/download/$VERSION/BugSplatNative.xcframework.zip"
          python3 - "$URL" "$CHECKSUM" "$VERSION" <<'EOF'
          import re, sys
          url, checksum, version = sys.argv[1:4]
          p = "Package.swift"; s = open(p).read()
          s2 = re.sub(r'path: "Frameworks/BugSplatNative\.xcframework"', f'url: "{url}",\n            checksum: "{checksum}"', s)
          assert s2 != s, "binary target not found"
          open(p, "w").write(s2)
          p = "BugSplat.podspec"; s = open(p).read()
          open(p, "w").write(re.sub(r"s\.version\s*=\s*'[^']*'", f"s.version      = '{version}'", s))
          EOF
          git diff --stat

      - name: Commit, tag and publish
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add Package.swift BugSplat.podspec
          git commit -m "chore: release $VERSION"
          git tag "$VERSION"
          git push origin HEAD:main
          git push origin "$VERSION"
          gh release create "$VERSION" Frameworks/BugSplatNative.xcframework.zip \
            --title "BugSplat $VERSION" \
            --notes "BugSplatNative.xcframework $VERSION (macOS arm64) built from bugsplat-native ${{ inputs.native_ref }}. Swift Package Manager: \`.package(url: \"https://github.com/BugSplat-Git/bugsplat-apple.git\", from: \"$VERSION\")\`."
